name: Gerar instalador Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projeto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar ferramentas no servidor
        run: npm install
      - name: Gerar instalador EXE
        run: npm run dist:win
      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Financas-Pessoais-Instalador-Windows
          path: projeto/dist/*.exe
          if-no-files-found: error
